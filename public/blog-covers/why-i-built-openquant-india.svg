<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" role="img" aria-label="Why I Built OpenQuant India">
  <defs>
    <pattern id="pat" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="40" cy="40" r="26" fill="none" stroke="#0e5c8f" stroke-width="1" opacity="0.14"/><circle cx="40" cy="40" r="14" fill="none" stroke="#5a7188" stroke-width="0.8" opacity="0.25"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e5c8f" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0e5c8f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="840" fill="#eef2f5"/>
  <rect width="1600" height="840" fill="url(#pat)"/>
  <rect width="1600" height="840" fill="url(#fade)"/>

  <rect x="90" y="90" width="70" height="6" rx="3" fill="#0e5c8f"/>

  <text x="90" y="140" font-family="'Inter', 'Geist', system-ui, sans-serif"
        font-size="26" letter-spacing="6" fill="#5a7188" font-weight="600">
    THECODERPANDA · BLOG
  </text>

  <text font-family="'Fraunces', 'Iowan Old Style', Georgia, serif"
        font-size="88" font-weight="600" fill="#0e1e2e"
        y="330" style="letter-spacing:-0.02em;">
    <tspan x="90" dy="0">Why I Built</tspan><tspan x="90" dy="100">OpenQuant</tspan><tspan x="90" dy="100">India</tspan>
  </text>

  <g transform="translate(90, 640)" opacity="0.75">
    <path d="M0 60 C60 40, 120 55, 180 30 S 300 10, 360 20 S 480 8, 540 4" fill="none" stroke="#9aa8b6" stroke-width="3"/>
    <path d="M0 90 C60 78, 120 88, 180 70 S 300 58, 360 62 S 480 52, 540 46" fill="none" stroke="#16a34a" stroke-width="4"/>
    <text x="560" y="14" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#5a7188" font-weight="500">gross</text>
    <text x="560" y="52" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#16a34a" font-weight="600">net (real)</text>
  </g>

  <text x="90" y="790" font-family="'Inter', 'Geist', system-ui, sans-serif"
        font-size="26" fill="#5a7188" font-weight="500">
    Shantanu Vishwanadha · thecoderpanda.com
  </text>

  <g transform="translate(1380, 620)">
    <circle cx="80" cy="80" r="80" fill="none" stroke="#0e5c8f" stroke-width="2" opacity="0.65"/>
    <text x="80" y="88" text-anchor="middle"
          font-family="'Fraunces', Georgia, serif" font-size="48" font-weight="600"
          fill="#0e1e2e" style="letter-spacing:-0.03em;">tcp</text>
    <text x="80" y="130" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#5a7188" letter-spacing="4">2026</text>
  </g>
</svg>
