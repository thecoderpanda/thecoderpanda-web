  <text font-family="'Fraunces', 'Iowan Old Style', Georgia, serif"
        font-size="68" font-weight="600" fill="#faf9f7"
        y="314.4" style="letter-spacing:-0.02em;">
    <tspan x="90" dy="0">Facebook Becomes</tspan><tspan x="90" dy="80">Meta: the Startup</tspan><tspan x="90" dy="80">Lessons in a $1T</tspan><tspan x="90" dy="80">Pivot</tspan>
  </text>

