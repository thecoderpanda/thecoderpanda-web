  <path d="M0 15 Q 15 0, 30 15 T 60 15" fill="none" stroke="#e8a87c" stroke-width="1.4" opacity="0.2"/>
</pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8a87c" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e8a87c" stop-opacity="0"/>
