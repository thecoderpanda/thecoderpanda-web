<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" role="img" aria-label="Sam Altman Gets Fired and Rehired in 5 Days: What OpenAI's Drama Means for AI">
  <defs>
    <pattern id="pat" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
  <circle cx="40" cy="40" r="26" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.14"/>
  <circle cx="40" cy="40" r="14" fill="none" stroke="#7a7a7a" stroke-width="0.8" opacity="0.25"/>
</pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1a1a1a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="840" fill="#faf9f7"/>
  <rect width="1600" height="840" fill="url(#pat)"/>
  <rect width="1600" height="840" fill="url(#fade)"/>

  <!-- Accent bar -->
  <rect x="90" y="90" width="70" height="6" rx="3" fill="#1a1a1a"/>

  <!-- Kicker -->
  <text x="90" y="140" font-family="'Inter', 'Geist', system-ui, sans-serif"
        font-size="26" letter-spacing="6" fill="#7a7a7a" font-weight="600">
    THECODERPANDA · BLOG
  </text>

  <!-- Title -->
  <text font-family="'Fraunces', 'Iowan Old Style', Georgia, serif"
        font-size="68" font-weight="600" fill="#1a1a1a"
        y="314.4" style="letter-spacing:-0.02em;">
    <tspan x="90" dy="0">Sam Altman Gets</tspan><tspan x="90" dy="80">Fired and Rehired in</tspan><tspan x="90" dy="80">5 Days: What</tspan><tspan x="90" dy="80">OpenAI's Drama Mean…</tspan>
  </text>

  <!-- Footer meta -->
  <text x="90" y="750" font-family="'Inter', 'Geist', system-ui, sans-serif"
        font-size="26" fill="#7a7a7a" font-weight="500">
    Shantanu Vishwanadha · thecoderpanda.com
  </text>

  <!-- Monogram + year badge -->
  <g transform="translate(1380, 620)">
    <circle cx="80" cy="80" r="80" fill="none" stroke="#1a1a1a" stroke-width="2" opacity="0.65"/>
    <text x="80" y="88" text-anchor="middle"
          font-family="'Fraunces', Georgia, serif" font-size="48" font-weight="600"
          fill="#1a1a1a" style="letter-spacing:-0.03em;">tcp</text>
    
  </g>
</svg>
