<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="380" fill="#f5efe4"/><text x="40" y="60" font-size="30" font-weight="700" fill="#2b2b2b">Six steps for an SME to adopt AI</text><line x1="40" y1="350" x2="1160" y2="350" stroke="#d9692b" stroke-width="4"/><rect x="40" y="120" width="170" height="200" rx="14" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><circle cx="125" cy="120" r="24" fill="#d9692b"/><text x="125" y="129" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="125" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Pick one pain</text><text x="125" y="222" text-anchor="middle" font-size="16" fill="#6b5f4b">A weekly task that</text><text x="125" y="246" text-anchor="middle" font-size="16" fill="#6b5f4b">wastes hours</text><rect x="230" y="120" width="170" height="200" rx="14" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><circle cx="315" cy="120" r="24" fill="#d9692b"/><text x="315" y="129" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="315" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Pilot 30 days</text><text x="315" y="222" text-anchor="middle" font-size="16" fill="#6b5f4b">One team, one tool,</text><text x="315" y="246" text-anchor="middle" font-size="16" fill="#6b5f4b">one owner</text><rect x="420" y="120" width="170" height="200" rx="14" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><circle cx="505" cy="120" r="24" fill="#d9692b"/><text x="505" y="129" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="505" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Measure</text><text x="505" y="222" text-anchor="middle" font-size="16" fill="#6b5f4b">Hours saved,</text><text x="505" y="246" text-anchor="middle" font-size="16" fill="#6b5f4b">errors cut</text><rect x="610" y="120" width="170" height="200" rx="14" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><circle cx="695" cy="120" r="24" fill="#d9692b"/><text x="695" y="129" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">4</text><text x="695" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Write the rules</text><text x="695" y="222" text-anchor="middle" font-size="16" fill="#6b5f4b">Data, review,</text><text x="695" y="246" text-anchor="middle" font-size="16" fill="#6b5f4b">what's off-limits</text><rect x="800" y="120" width="170" height="200" rx="14" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><circle cx="885" cy="120" r="24" fill="#d9692b"/><text x="885" y="129" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">5</text><text x="885" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Train & spread</text><text x="885" y="222" text-anchor="middle" font-size="16" fill="#6b5f4b">Peers teach peers</text><rect x="990" y="120" width="170" height="200" rx="14" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><circle cx="1075" cy="120" r="24" fill="#d9692b"/><text x="1075" y="129" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">6</text><text x="1075" y="185" text-anchor="middle" font-size="19" font-weight="700" fill="#2b2b2b">Scale</text><text x="1075" y="222" text-anchor="middle" font-size="16" fill="#6b5f4b">Add the next</text><text x="1075" y="246" text-anchor="middle" font-size="16" fill="#6b5f4b">workflow</text></svg>