<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
<title id="title">Count all the time, including checking</title><desc id="desc">Example: manual work takes 20 minutes. AI-assisted work takes 4 minutes preparation, 2 drafting and 6 review, saving 8 minutes.</desc>
<rect width="1000" height="640" fill="#f5efe4"/>
<text x="40" y="58" font-size="32" fill="#2b2b2b" font-weight="700">Count all the time, including checking</text>
<text x="40" y="101" font-size="22" fill="#6b5f4b" font-weight="400">Hypothetical example per quotation. Not measured business results.</text><text x="40" y="164" font-size="25" fill="#2b2b2b" font-weight="700">Manual preparation</text><text x="824" y="164" font-size="25" fill="#2b2b2b" font-weight="700">20 min</text><rect x="40" y="186" width="840" height="65" rx="4" fill="#c9b99a" stroke="#2b2b2b" stroke-width="2"/><text x="40" y="311" font-size="25" fill="#2b2b2b" font-weight="700">With AI, including review</text><text x="824" y="311" font-size="25" fill="#2b2b2b" font-weight="700">12 min</text><rect x="40" y="333" width="168" height="65" rx="0" fill="#e8d9bd" stroke="#2b2b2b" stroke-width="2"/><rect x="208" y="333" width="84" height="65" rx="0" fill="#d9692b" stroke="#2b2b2b" stroke-width="2"/><rect x="292" y="333" width="252" height="65" rx="0" fill="#416653" stroke="#2b2b2b" stroke-width="2"/><text x="56" y="374" font-size="24" fill="#2b2b2b" font-weight="400">4 min</text><text x="225" y="374" font-size="24" fill="#ffffff" font-weight="400">2</text><text x="375" y="374" font-size="24" fill="#ffffff" font-weight="400">6 min</text><rect x="544" y="333" width="336" height="65" fill="none" stroke="#6b5f4b" stroke-width="2" stroke-dasharray="7 7"/><text x="601" y="374" font-size="24" fill="#6b5f4b" font-weight="400">8 min saved</text><rect x="40" y="442" width="22" height="22" rx="2" fill="#e8d9bd" stroke="#2b2b2b" stroke-width="2"/><text x="74" y="461" font-size="23" fill="#2b2b2b" font-weight="400">Prepare: 4 min</text><rect x="345" y="442" width="22" height="22" rx="2" fill="#d9692b" stroke="#2b2b2b" stroke-width="2"/><text x="379" y="461" font-size="23" fill="#2b2b2b" font-weight="400">Draft: 2 min</text><rect x="640" y="442" width="22" height="22" rx="2" fill="#416653" stroke="#2b2b2b" stroke-width="2"/><text x="674" y="461" font-size="23" fill="#2b2b2b" font-weight="400">Review: 6 min</text><text x="40" y="535" font-size="27" fill="#2b2b2b" font-weight="700">100 similar quotes = 13 hours 20 minutes saved.</text><text x="40" y="578" font-size="21" fill="#6b5f4b" font-weight="400">Before setup and training. Time saved is not the same as cash saved.</text>
</svg>
