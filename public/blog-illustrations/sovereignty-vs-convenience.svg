<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Sovereignty vs convenience tradeoff chart">
  <defs>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2ded6" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="1200" height="620" fill="#faf9f7"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <rect x="60" y="40" width="60" height="6" rx="3" fill="#b0413e"/>
  <text x="60" y="80" font-family="'Inter', system-ui, sans-serif" font-size="22" letter-spacing="5" fill="#6a6a6a" font-weight="600">
    THE MARKET, EMPIRICALLY
  </text>
  <text x="60" y="130" font-family="'Fraunces', Georgia, serif" font-size="44" font-weight="600" fill="#1a1a1a" style="letter-spacing:-0.02em;">
    Sovereignty vs. convenience
  </text>

  <!-- axes -->
  <line x1="150" y1="540" x2="1120" y2="540" stroke="#4a4a4a" stroke-width="2"/>
  <line x1="150" y1="540" x2="150" y2="200" stroke="#4a4a4a" stroke-width="2"/>

  <text x="1120" y="570" text-anchor="end" font-family="'Inter', system-ui, sans-serif" font-size="18" fill="#4a4a4a">
    Convenience →
  </text>
  <text x="140" y="215" text-anchor="end" font-family="'Inter', system-ui, sans-serif" font-size="18" fill="#4a4a4a" transform="rotate(-90 140 215)">
    ↑ Users
  </text>

  <!-- trend curve (rising toward convenience) -->
  <path d="M 170 480 Q 500 470 750 400 T 1100 220" fill="none" stroke="#b0413e" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Data points: (name, x, y, size, label anchor) -->
  <!-- Self-hosted email -->
  <circle cx="200" cy="500" r="9" fill="#4a4a4a"/>
  <text x="215" y="505" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#1a1a1a">Self-hosted email</text>

  <!-- Hardware wallets -->
  <circle cx="260" cy="490" r="10" fill="#4a4a4a"/>
  <text x="275" y="495" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#1a1a1a">Hardware wallets</text>

  <!-- Local LLMs -->
  <circle cx="330" cy="475" r="11" fill="#4a4a4a"/>
  <text x="345" y="480" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#1a1a1a">Local LLMs</text>

  <!-- Signal -->
  <circle cx="480" cy="430" r="16" fill="#7a7a7a"/>
  <text x="500" y="435" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#1a1a1a">Signal</text>

  <!-- Coinbase -->
  <circle cx="700" cy="360" r="22" fill="#c58a1a" opacity="0.85"/>
  <text x="725" y="365" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#1a1a1a">Coinbase / custodial wallets</text>

  <!-- WhatsApp -->
  <circle cx="880" cy="290" r="28" fill="#2f7a52" opacity="0.85"/>
  <text x="915" y="295" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#1a1a1a">WhatsApp</text>

  <!-- Gmail / iCloud / ChatGPT cluster -->
  <circle cx="1010" cy="245" r="34" fill="#b0413e" opacity="0.85"/>
  <text x="1050" y="240" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#1a1a1a">Gmail</text>
  <text x="1050" y="258" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#1a1a1a">iCloud, ChatGPT</text>

  <!-- Bubble size legend -->
  <text x="150" y="590" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#6a6a6a">
    Bubble area ≈ approx. daily active users (log scale, illustrative)
  </text>

  <!-- Byline -->
  <text x="1120" y="590" text-anchor="end" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#9a9a9a">
    thecoderpanda.com
  </text>
</svg>
