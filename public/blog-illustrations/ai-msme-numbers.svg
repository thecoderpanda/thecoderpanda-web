<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="330" fill="#f5efe4"/><text x="40" y="60" font-size="30" font-weight="700" fill="#2b2b2b">Why MSMEs are the real AI opportunity</text><rect x="40" y="110" width="255" height="170" rx="16" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><text x="167" y="195" text-anchor="middle" font-size="48" font-weight="700" fill="#d9692b">~63 mn</text><text x="167" y="240" text-anchor="middle" font-size="20" fill="#2b2b2b">MSMEs in India</text><rect x="325" y="110" width="255" height="170" rx="16" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><text x="452" y="195" text-anchor="middle" font-size="48" font-weight="700" fill="#d9692b">~30%</text><text x="452" y="240" text-anchor="middle" font-size="20" fill="#2b2b2b">share of GDP</text><rect x="610" y="110" width="255" height="170" rx="16" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><text x="737" y="195" text-anchor="middle" font-size="48" font-weight="700" fill="#d9692b">~45%</text><text x="737" y="240" text-anchor="middle" font-size="20" fill="#2b2b2b">share of exports</text><rect x="895" y="110" width="255" height="170" rx="16" fill="#fff" stroke="#2b2b2b" stroke-width="2"/><text x="1022" y="195" text-anchor="middle" font-size="48" font-weight="700" fill="#d9692b">~110 mn</text><text x="1022" y="240" text-anchor="middle" font-size="20" fill="#2b2b2b">jobs supported</text><text x="40" y="315" font-size="14" fill="#6b5f4b">Approximate figures as commonly cited by India's Ministry of MSME.</text></svg>