<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
<title id="title">One enquiry, with a person checking</title><desc id="desc">Illustrative quotation storyboard: enquiry, AI draft, source checks, human approval.</desc>
<rect width="1000" height="640" fill="#f5efe4"/>
<text x="40" y="58" font-size="32" fill="#2b2b2b" font-weight="700">One enquiry, with a person checking</text>
<text x="40" y="97" font-size="21" fill="#6b5f4b" font-weight="400">A sample quotation task. The assistant still checks the work.</text><rect x="45" y="135" width="405" height="190" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><text x="70" y="172" font-size="25" fill="#2b2b2b" font-weight="700">1. Read the enquiry</text><rect x="70" y="193" width="58" height="105" rx="8" fill="#e8d9bd" stroke="#2b2b2b" stroke-width="2"/><path d="M87 208L110 208" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M87 222L110 222" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/><text x="150" y="218" font-size="23" fill="#2b2b2b" font-weight="400">“20 switches, plus the</text><text x="150" y="250" font-size="23" fill="#2b2b2b" font-weight="400">same cable as last time.”</text><text x="150" y="294" font-size="22" fill="#d9692b" font-weight="700">Which cable? Ask first.</text><rect x="550" y="135" width="405" height="190" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><text x="575" y="172" font-size="25" fill="#2b2b2b" font-weight="700">2. Prepare a draft</text><rect x="575" y="193" width="65" height="85" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><path d="M588 216L626 216" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M588 234L621 234" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M588 252L614 252" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/><text x="663" y="220" font-size="22" fill="#2b2b2b" font-weight="400">AI lists the known items.</text><text x="663" y="253" font-size="22" fill="#2b2b2b" font-weight="400">It flags missing details.</text><text x="663" y="294" font-size="22" fill="#d9692b" font-weight="700">No guessed prices.</text><rect x="45" y="360" width="405" height="190" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><text x="70" y="397" font-size="25" fill="#2b2b2b" font-weight="700">3. Check the source</text><rect x="70" y="420" width="65" height="90" rx="12" fill="#e8d9bd" stroke="#2b2b2b" stroke-width="2"/><path d="M83 442L122 442" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M83 459L122 459" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/><text x="155" y="445" font-size="23" fill="#2b2b2b" font-weight="400">The assistant checks</text><text x="155" y="477" font-size="23" fill="#2b2b2b" font-weight="400">codes and quantities.</text><text x="155" y="519" font-size="21" fill="#416653" font-weight="700">Use the current price list.</text><rect x="550" y="360" width="405" height="190" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><text x="575" y="397" font-size="25" fill="#2b2b2b" font-weight="700">4. Approve and send</text><circle cx="608" cy="453" r="30" fill="#dce5d9"/><path d="M594 454L604 464" stroke="#416653" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M604 464L623 441" stroke="#416653" stroke-width="4" fill="none" stroke-linecap="round"/><text x="660" y="445" font-size="23" fill="#2b2b2b" font-weight="400">The usual approver</text><text x="660" y="477" font-size="23" fill="#2b2b2b" font-weight="400">checks the final quote.</text><text x="660" y="519" font-size="21" fill="#416653" font-weight="700">A person sends the reply.</text><text x="45" y="604" font-size="23" fill="#6b5f4b" font-weight="400">AI drafts text. Your team remains responsible for the quotation.</text>
</svg>
