<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
<title id="title">A first month the team can manage</title><desc id="desc">Days 1 to 7 observe, 8 to 14 practise, 15 to 23 try with review, 24 to 30 evaluate.</desc>
<rect width="1000" height="655" fill="#f5efe4"/>
<text x="40" y="58" font-size="32" fill="#2b2b2b" font-weight="700">A first month the team can manage</text>
<text x="40" y="99" font-size="21" fill="#6b5f4b" font-weight="400">Suggested schedule. Agree on cost and quality limits at the start.</text><rect x="40" y="140" width="440" height="195" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><rect x="58" y="130" width="135" height="48" rx="5" fill="#d9692b" stroke="#2b2b2b" stroke-width="2"/><text x="72" y="163" font-size="25" fill="#fff" font-weight="700">01–07</text><text x="63" y="221" font-size="29" fill="#2b2b2b" font-weight="700">Observe</text><text x="63" y="262" font-size="23" fill="#2b2b2b" font-weight="400">Time the current task.</text><text x="63" y="297" font-size="23" fill="#2b2b2b" font-weight="400">Agree on the data rules.</text><rect x="520" y="140" width="440" height="195" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><rect x="538" y="130" width="135" height="48" rx="5" fill="#d9692b" stroke="#2b2b2b" stroke-width="2"/><text x="552" y="163" font-size="25" fill="#fff" font-weight="700">08–14</text><text x="543" y="221" font-size="29" fill="#2b2b2b" font-weight="700">Practise</text><text x="543" y="262" font-size="23" fill="#2b2b2b" font-weight="400">Use dummy examples.</text><text x="543" y="297" font-size="23" fill="#2b2b2b" font-weight="400">Check good and bad answers.</text><rect x="40" y="375" width="440" height="195" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><rect x="58" y="365" width="135" height="48" rx="5" fill="#d9692b" stroke="#2b2b2b" stroke-width="2"/><text x="72" y="398" font-size="25" fill="#fff" font-weight="700">15–23</text><text x="63" y="456" font-size="29" fill="#2b2b2b" font-weight="700">Try with review</text><text x="63" y="497" font-size="23" fill="#2b2b2b" font-weight="400">Use only approved inputs.</text><text x="63" y="532" font-size="23" fill="#2b2b2b" font-weight="400">Log time and corrections.</text><rect x="520" y="375" width="440" height="195" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><rect x="538" y="365" width="135" height="48" rx="5" fill="#d9692b" stroke="#2b2b2b" stroke-width="2"/><text x="552" y="398" font-size="25" fill="#fff" font-weight="700">24–30</text><text x="543" y="456" font-size="29" fill="#2b2b2b" font-weight="700">Decide</text><text x="543" y="497" font-size="23" fill="#2b2b2b" font-weight="400">Compare benefit and cost.</text><text x="543" y="532" font-size="23" fill="#2b2b2b" font-weight="400">Keep it, change it or stop.</text><text x="40" y="618" font-size="22" fill="#6b5f4b" font-weight="400">No automatic sending, payments or changes to business records.</text>
</svg>
