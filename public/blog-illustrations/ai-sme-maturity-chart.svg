<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
<title id="title">Find your starting point</title><desc id="desc">Four possible starting points for AI adoption without percentages or survey claims.</desc>
<rect width="1000" height="655" fill="#f5efe4"/>
<text x="40" y="58" font-size="32" fill="#2b2b2b" font-weight="700">Find your starting point</text>
<text x="40" y="100" font-size="23" fill="#6b5f4b" font-weight="400">Possible stages, not a survey or a ranking of businesses.</text><rect x="40" y="145" width="440" height="190" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><circle cx="78" cy="185" r="22" fill="#d9692b"/><text x="71" y="193" font-size="23" fill="#fff" font-weight="700">1</text><text x="113" y="194" font-size="27" fill="#2b2b2b" font-weight="700">No use yet</text><text x="65" y="253" font-size="24" fill="#2b2b2b" font-weight="400">Choose one task.</text><text x="65" y="292" font-size="24" fill="#2b2b2b" font-weight="400">Prepare safe examples.</text><rect x="520" y="145" width="440" height="190" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><circle cx="558" cy="185" r="22" fill="#d9692b"/><text x="551" y="193" font-size="23" fill="#fff" font-weight="700">2</text><text x="593" y="194" font-size="27" fill="#2b2b2b" font-weight="700">Individual trials</text><text x="545" y="253" font-size="24" fill="#2b2b2b" font-weight="400">Ask what people use.</text><text x="545" y="292" font-size="24" fill="#2b2b2b" font-weight="400">Agree on shared rules.</text><rect x="40" y="380" width="440" height="190" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><circle cx="78" cy="420" r="22" fill="#d9692b"/><text x="71" y="428" font-size="23" fill="#fff" font-weight="700">3</text><text x="113" y="429" font-size="27" fill="#2b2b2b" font-weight="700">One team process</text><text x="65" y="488" font-size="24" fill="#2b2b2b" font-weight="400">Share instructions.</text><text x="65" y="527" font-size="24" fill="#2b2b2b" font-weight="400">Name a reviewer.</text><rect x="520" y="380" width="440" height="190" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="2"/><circle cx="558" cy="420" r="22" fill="#d9692b"/><text x="551" y="428" font-size="23" fill="#fff" font-weight="700">4</text><text x="593" y="429" font-size="27" fill="#2b2b2b" font-weight="700">Wider use</text><text x="545" y="488" font-size="24" fill="#2b2b2b" font-weight="400">Check results first.</text><text x="545" y="527" font-size="24" fill="#2b2b2b" font-weight="400">Then try another task.</text><text x="40" y="620" font-size="23" fill="#6b5f4b" font-weight="400">Stay with one useful task for as long as it serves the business.</text>
</svg>
