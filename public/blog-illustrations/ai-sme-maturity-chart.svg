<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Helvetica,Arial,sans-serif"><rect width="1200" height="540" fill="#f5efe4"/><text x="40" y="55" font-size="30" font-weight="700" fill="#2b2b2b">Where a typical Indian SME sits on AI</text><text x="40" y="85" font-size="17" fill="#6b5f4b">Illustrative picture from conversations, not survey data</text><line x1="80" y1="440" x2="1140" y2="440" stroke="#2b2b2b" stroke-width="2"/><rect x="110" y="200" width="150" height="240" fill="#c9b99a"/><text x="185" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#2b2b2b">30%</text><text x="185" y="468" text-anchor="middle" font-size="17" fill="#6b5f4b">Never tried</text><rect x="360" y="160" width="150" height="280" fill="#d9a066"/><text x="435" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#2b2b2b">35%</text><text x="435" y="468" text-anchor="middle" font-size="17" fill="#6b5f4b">Individuals</text><text x="435" y="490" text-anchor="middle" font-size="17" fill="#6b5f4b">experimenting</text><rect x="610" y="280" width="150" height="160" fill="#d9692b"/><text x="685" y="270" text-anchor="middle" font-size="22" font-weight="700" fill="#2b2b2b">20%</text><text x="685" y="468" text-anchor="middle" font-size="17" fill="#6b5f4b">One team</text><text x="685" y="490" text-anchor="middle" font-size="17" fill="#6b5f4b">with a process</text><rect x="860" y="360" width="150" height="80" fill="#8a3b12"/><text x="935" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#2b2b2b">10%</text><text x="935" y="468" text-anchor="middle" font-size="17" fill="#6b5f4b">Company-wide</text><text x="935" y="490" text-anchor="middle" font-size="17" fill="#6b5f4b">habit</text></svg>