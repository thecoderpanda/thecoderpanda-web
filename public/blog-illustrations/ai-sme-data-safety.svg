<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif">
<title id="title">What can go into the trial?</title><desc id="desc">Use public or dummy material; get approval for internal records; keep sensitive data out.</desc>
<rect width="1000" height="660" fill="#f5efe4"/>
<text x="40" y="58" font-size="32" fill="#2b2b2b" font-weight="700">What can go into the trial?</text>
<text x="40" y="98" font-size="22" fill="#6b5f4b" font-weight="400">A guide for a first trial with a general-purpose chat tool.</text><rect x="40" y="135" width="920" height="115" rx="12" fill="#e5ebdf" stroke="#2b2b2b" stroke-width="2"/><text x="65" y="186" font-size="22" fill="#416653" font-weight="700">TRY</text><text x="235" y="179" font-size="26" fill="#2b2b2b" font-weight="700">Public or invented</text><text x="235" y="218" font-size="23" fill="#2b2b2b" font-weight="400">Public product descriptions, dummy enquiries.</text><rect x="40" y="275" width="920" height="115" rx="12" fill="#f2e4c6" stroke="#2b2b2b" stroke-width="2"/><text x="65" y="326" font-size="22" fill="#926222" font-weight="700">ASK</text><text x="235" y="319" font-size="26" fill="#2b2b2b" font-weight="700">Internal material</text><text x="235" y="358" font-size="23" fill="#2b2b2b" font-weight="400">Price lists and contracts need approval first.</text><rect x="40" y="415" width="920" height="115" rx="12" fill="#f0dcd2" stroke="#2b2b2b" stroke-width="2"/><text x="65" y="466" font-size="22" fill="#994433" font-weight="700">KEEP OUT</text><text x="235" y="459" font-size="26" fill="#2b2b2b" font-weight="700">Sensitive records</text><text x="235" y="498" font-size="23" fill="#2b2b2b" font-weight="400">Aadhaar, bank details, payroll and passwords.</text><text x="40" y="585" font-size="24" fill="#2b2b2b" font-weight="700">A paid plan alone does not make an upload safe.</text><text x="40" y="619" font-size="21" fill="#6b5f4b" font-weight="400">Check storage, training and access terms before using company records.</text>
</svg>
